<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Known – Admin</title>
<meta name="description" content="Known's private admin: catalog corrections, the catalog and AI costs.">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://lpajxlwmsgolxajndgdv.supabase.co https://world.openfoodfacts.org; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Known Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="admin.css?v=2026-11-05b">
</head>
<body>
<header class="top">
  <img class="wm" src="../assets/wordmark-white.svg" alt="Known" width="76" height="19">
  <nav id="tabs" role="tablist" aria-label="Sections" hidden>
    <button type="button" role="tab" id="tab-corrections" aria-controls="corrections" aria-selected="true">Corrections <span class="badge y" id="tab-count"></span></button>
    <button type="button" role="tab" id="tab-catalog" aria-controls="catalog" aria-selected="false" tabindex="-1">Catalog</button>
    <button type="button" role="tab" id="tab-costs" aria-controls="costs" aria-selected="false" tabindex="-1">Costs</button>
  </nav>
  <span class="sp"></span>
  <button type="button" class="link" id="signout" hidden>Sign out</button>
</header>

<main id="signin" class="signin" hidden aria-labelledby="signin-title">
  <h1 id="signin-title">Admin</h1>
  <form id="email-form" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" inputmode="email" required>
    <button type="submit" class="primary">Send code</button>
  </form>
  <form id="code-form" novalidate hidden>
    <p id="code-sent" class="muted"></p>
    <label for="code">Code</label>
    <input id="code" type="text" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="10" required>
    <div class="row">
      <button type="submit" class="primary">Sign in</button>
      <button type="button" class="ghost" id="other-email">Use another email</button>
    </div>
  </form>
  <p id="signin-status" class="status" role="status" aria-live="polite"></p>
</main>

<main id="corrections" role="tabpanel" aria-labelledby="tab-corrections" hidden>
  <div class="desk">
    <aside class="queues" id="queues" aria-label="Queues"></aside>
    <section class="list" aria-label="Corrections">
      <div class="search"><input id="search" type="search" placeholder="Search name, brand or EAN" aria-label="Search corrections"></div>
      <div id="list"></div>
    </section>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
  <div class="mob" id="mob"></div>
</main>

<main id="catalog" role="tabpanel" aria-labelledby="tab-catalog" hidden>
  <div class="cdesk" id="cdesk">
    <aside class="queues" id="cat-filters" aria-label="Filters"></aside>
    <section class="list" aria-label="Products">
      <div class="search"><input id="cat-search" type="search" placeholder="Search name, brand or EAN" aria-label="Search the catalog"></div>
      <div id="cat-list" class="clist"></div>
    </section>
    <section class="detail" id="cat-detail" aria-live="polite"></section>
  </div>
</main>

<main id="costs" class="costs" role="tabpanel" aria-labelledby="tab-costs" hidden>
  <div class="bar-row">
    <div class="seg" role="group" aria-label="Who">
      <button type="button" data-plan="real" aria-pressed="false">Real users</button>
      <button type="button" data-plan="dev" aria-pressed="false">Test builds</button>
      <button type="button" data-plan="all" aria-pressed="true">All</button>
    </div>
    <div class="seg" role="group" aria-label="Period">
      <button type="button" data-days="7" aria-pressed="true">7 days</button>
      <button type="button" data-days="30" aria-pressed="false">30 days</button>
      <button type="button" data-days="90" aria-pressed="false">90 days</button>
    </div>
  </div>
  <div id="costs-body"></div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="admin.js?v=2026-11-05b"></script>
</body>
</html>
